name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tipos
        run: npm run check
      - name: Compilar
        run: npm run build
      - name: Pruebas
        run: npm test
      - name: Presupuesto de tamaño
        run: |
          HTML=$(wc -c < dist/index.html)
          HTML_GZ=$(gzip -c dist/index.html | wc -c)
          echo "HTML portada: ${HTML}b sin comprimir, ${HTML_GZ}b comprimido"
          if [ "$HTML_GZ" -gt 25600 ]; then
            echo "::error::El HTML comprimido supera el presupuesto de 25600b"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
